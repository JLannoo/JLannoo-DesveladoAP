name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WORLD=$(python3 -c 'import json; print(json.load(open("world/archipelago.json"))["world_version"])')
          CLIENT=$(python3 -c 'import json; print(json.load(open("client/manifest.json"))["version_number"])')
          echo "tag=$VERSION world=$WORLD client=$CLIENT"
          [[ "$WORLD" == "$VERSION" && "$CLIENT" == "$VERSION" ]] || { echo "::error::Version mismatch"; exit 1; }

      - name: Build apworld
        run: |
          mkdir -p dist/apworld
          cp -r world dist/apworld/desvelado
          cd dist/apworld
          zip -r ../desvelado.apworld desvelado -x '*__pycache__*' '*.puml'

      - name: Build mod
        run: |
          mkdir -p dist/mod/mods-unpacked
          cp -r client dist/mod/mods-unpacked/JLannoo-DesveladoAP
          cd dist/mod
          zip -r ../JLannoo-DesveladoAP.zip mods-unpacked

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/desvelado.apworld dist/JLannoo-DesveladoAP.zip \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
